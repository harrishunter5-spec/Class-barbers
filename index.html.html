<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Class Barbers</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: #0b0b0b;
  color: #eee;
}

header {
  height: 100vh;
  background: url('https://images.unsplash.com/photo-1503951914875-452162b0f3f1') center/cover;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
}

header h1 {
  font-family: 'Playfair Display', serif;
  font-size: 4em;
  letter-spacing: 2px;
}

header p {
  color: #c9a96e;
  font-size: 1.2em;
}

nav {
  position: fixed;
  width: 100%;
  top: 0;
  background: rgba(0,0,0,0.8);
  padding: 15px;
  text-align: center;
}

nav a {
  color: #eee;
  margin: 0 20px;
  text-decoration: none;
  font-size: 0.9em;
}

section {
  padding: 80px 20px;
  max-width: 900px;
  margin: auto;
  text-align: center;
}

h2 {
  font-family: 'Playfair Display', serif;
  margin-bottom: 30px;
}

.pricing {
  border-top: 1px solid #333;
}

.price {
  display: flex;
  justify-content: space-between;
  padding: 15px 0;
  border-bottom: 1px solid #222;
}

.price span:last-child {
  color: #c9a96e;
}

.booking input, .booking select {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
  background: #111;
  border: 1px solid #333;
  color: white;
}

button {
  background: transparent;
  border: 1px solid #c9a96e;
  color: #c9a96e;
  padding: 12px 30px;
  cursor: pointer;
  letter-spacing: 1px;
}

button:hover {
  background: #c9a96e;
  color: black;
}

footer {
  text-align: center;
  padding: 40px;
  border-top: 1px solid #222;
}
</style>
</head>

<body>

<nav>
  <a href="#prices">PRICES</a>
  <a href="#booking">BOOK</a>
  <a href="#contact">CONTACT</a>
</nav>

<header>
  <h1>CLASS BARBERS</h1>
  <p>Precision. Style. Excellence.</p>
</header>

<section id="prices">
  <h2>Quality Cuts. Fair Prices.</h2>
  <div class="pricing">
    <div class="price"><span>Haircut</span><span>£15</span></div>
    <div class="price"><span>Skin Fade</span><span>£18</span></div>
    <div class="price"><span>Beard Trim</span><span>£10</span></div>
    <div class="price"><span>Hair + Beard</span><span>£22</span></div>
  </div>
  <p style="color:#c9a96e;">Walk-ins welcome • No appointment needed</p>
</section>

<section id="booking">
  <h2>Book Appointment</h2>
  <div class="booking">
    <form onsubmit="bookNow(event)">
      <input type="text" placeholder="Full Name" required>
      <select required>
        <option>Select Service</option>
        <option>Haircut</option>
        <option>Skin Fade</option>
        <option>Beard Trim</option>
        <option>Hair + Beard</option>
      </select>
      <input type="date" required>
      <input type="time" required>
      <button type="submit">BOOK NOW</button>
    </form>
  </div>
</section>

<section id="contact">
  <h2>Visit Us</h2>
  <p>3 Gracemount Dr, Edinburgh</p>
  <p>0131 629 1690</p>
</section>

<footer>
  <p>© 2026 Class Barbers</p>
</footer>

<script>
function bookNow(e) {
  e.preventDefault();
  alert("Appointment request received.");
}
</script>

</body>
</html>
